<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MAJA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAJA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c6b8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241c3c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="majatank.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>">
<style>
/* Bloom palette, sampled from the sunset photo */
:root{
  --sky1:#c6b8ff;--sky2:#e7cdff;--sky3:#fec8ee;--sky4:#fda98f;--sky5:#f6c6b0;
  --card:rgba(255,255,255,.72);--card-line:rgba(255,255,255,.9);
  --ink:#392f52;--mute:#8577a0;--accent:#e35b3d;--accent-ink:#fff;
  --good:#c97a1f;--goodbg:rgba(201,122,31,.13);--bad:#c44242;
  --sep:rgba(57,47,82,.10);
  --dev-w:393px;--radius-lg:24px;--radius-md:16px;--radius-sm:12px;
  --shadow:0 6px 20px rgba(120,70,110,.12);
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#241c3c;--sky2:#3a2650;--sky3:#55284a;--sky4:#6e3430;--sky5:#432a30;
  --card:rgba(35,27,48,.78);--card-line:rgba(255,255,255,.08);
  --ink:#f3eefc;--mute:#b3a3cf;--accent:#ff8562;--accent-ink:#241534;
  --good:#f0a94a;--goodbg:rgba(240,169,74,.16);--bad:#ff7a6e;
  --sep:rgba(255,255,255,.10);
  --shadow:0 6px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --sky1:#241c3c;--sky2:#3a2650;--sky3:#55284a;--sky4:#6e3430;--sky5:#432a30;
  --card:rgba(35,27,48,.78);--card-line:rgba(255,255,255,.08);
  --ink:#f3eefc;--mute:#b3a3cf;--accent:#ff8562;--accent-ink:#241534;
  --good:#f0a94a;--goodbg:rgba(240,169,74,.16);--bad:#ff7a6e;
  --sep:rgba(255,255,255,.10);
  --shadow:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;color:var(--ink);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 30%,var(--sky3) 55%,var(--sky4) 78%,var(--sky5) 100%);
  background-attachment:fixed;
  min-height:100%;
}
main{width:100%;max-width:var(--dev-w);margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  will-change:transform}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:34px;font-weight:800;margin:2px 0 0;letter-spacing:-.023em}
.sub{color:var(--ink);opacity:.75;font-size:13px;font-weight:500;margin:3px 0 14px}

button{
  font:inherit;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;
  border:1px solid var(--card-line);border-radius:999px;padding:10px 16px;
  background:var(--card);box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
button:active{transform:scale(.96)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button#btnSet{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
button#btnSet svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:9px;margin:2px 0 12px}
.bar button{flex:none}
.bar .pri{flex:1}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:7px 15px;font-size:14px;font-weight:600;color:var(--mute);box-shadow:none}
.chips button.on{color:var(--accent-ink);background:var(--ink);border-color:var(--ink)}

ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
li{display:flex;align-items:center;gap:12px;border-radius:var(--radius-md);padding:13px 16px;
  background:var(--card);border:1px solid var(--card-line);box-shadow:var(--shadow)}
li.best{border-color:var(--good);background:linear-gradient(0deg,var(--goodbg),var(--goodbg)),var(--card)}
li.closed{opacity:.55}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{color:var(--mute);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-variant-numeric:tabular-nums;font-size:23px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.price sup{font-size:.55em;vertical-align:.6em;margin-left:1px;font-weight:700}
li.best .price{color:var(--good)}
.na{font-size:13px;color:var(--mute);font-weight:600}
.del{padding:6px 11px;color:var(--bad);border-radius:50%;width:34px;height:34px;font-size:14px;box-shadow:none}

.panel{border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;display:none;
  background:var(--card);border:1px solid var(--card-line);box-shadow:var(--shadow)}
.panel.open{display:block;animation:pop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700;margin:16px 0 7px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:9px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--sep);background:rgba(127,127,127,.09);color:var(--ink)}
input::placeholder{color:var(--mute)}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.w{flex:0 0 92px}

#msg{min-height:20px;font-size:13px;font-weight:600;margin:0 0 9px;color:var(--ink);opacity:.75;padding:0 2px}
#msg.err{color:var(--bad);opacity:1}
.empty{text-align:center;color:var(--ink);opacity:.7;padding:38px 10px;font-size:15px}
.foot{color:var(--ink);opacity:.65;font-size:11.5px;line-height:1.5;margin-top:20px;padding:0 2px}

#ptr{position:fixed;left:50%;top:env(safe-area-inset-top,0px);width:40px;height:40px;margin-left:-20px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;
  transform:translateY(-20px);pointer-events:none;z-index:10;
  background:var(--card);border:1px solid var(--card-line);box-shadow:var(--shadow)}
#ptr svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#ptr.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#ptr.spin svg{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></div>
<main>
  <header>
    <h1>MAJA</h1>
    <button id="btnSet" aria-expanded="false" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.7 7.7 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9c.77.66 1.65 1.17 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4-2-1.5Z"/></svg>
    </button>
  </header>
  <p class="sub" id="upd">Noch nicht aktualisiert</p>

  <section class="panel" id="panel">
    <h2>Tankerkönig API-Key</h2>
    <input id="key" type="password" placeholder="API-Key einfügen" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row" style="margin-top:8px"><button class="pri" id="saveKey">Speichern &amp; laden</button></div>

    <h2>Tankstellen hinzufügen</h2>
    <div class="row">
      <div><label for="city">Ort</label><input id="city" placeholder="z. B. Biberach"></div>
      <div class="w"><label for="rad">Radius km</label><input id="rad" type="number" inputmode="decimal" min="1" max="25" value="6"></div>
    </div>
    <div class="row" style="margin-top:8px"><button id="addCity">Alle Tankstellen im Umkreis hinzufügen</button></div>

    <h2>Verwalten</h2>
    <div class="row">
      <button id="btnEdit">Stationen entfernen</button>
      <button id="btnReset">Alles zurücksetzen</button>
    </div>
  </section>

  <div id="msg" role="status"></div>
  <div class="bar">
    <button class="pri" id="btnRef">Jetzt aktualisieren</button>
    <button id="btnOpen">Nur geöffnete: an</button>
  </div>
  <div class="chips" id="chips"></div>
  <ul id="list"></ul>
  <p class="foot">Preisdaten: Tankerkönig / Markttransparenzstelle für Kraftstoffe (CC BY 4.0). Aktualisiert sich stündlich, solange die App geöffnet ist.</p>
</main>

<script>
const API = "https://creativecommons.tankerkoenig.de/json/";
const PRESETS = [
  {q: "Memmingen", lat: 47.9831, lng: 10.1806, rad: 6},
  {q: "Ulm", lat: 48.3984, lng: 9.9916, rad: 8},
  {q: "Senden", lat: 48.3236, lng: 10.0441, rad: 6}
];
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let key = store.get("tk_key", "");
let stations = store.get("tk_stations", []);
let prices = store.get("tk_prices", {});
let updated = store.get("tk_updated", null);
let city = "Alle", onlyOpen = true, editing = false, busy = false;
const tidy = t => String(t || "").toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

// Namen säubern und direkt alte "Blaustein"-Einträge aus dem Speicher kicken
stations.forEach(s => { s.place = tidy(s.place); });
stations = stations.filter(s => s.place !== "Blaustein");

function msg(t, err){ $("msg").textContent = t || ""; $("msg").className = err ? "err" : ""; }
function persist(){ store.set("tk_stations", stations); store.set("tk_prices", prices); store.set("tk_updated", updated); }

async function call(endpoint, params){
  const url = API + endpoint + "?" + new URLSearchParams({...params, apikey: key});
  let r;
  try { r = await fetch(url); } catch(e){ throw new Error("Keine Verbindung zu Tankerkönig (Netzwerk oder Browser-Sperre)."); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.message || "Tankerkönig hat die Anfrage abgelehnt.");
  return j;
}

async function addArea(lat, lng, rad){
  const j = await call("list.php", {lat, lng, rad, sort: "dist", type: "all"});
  let added = 0;
  for (const s of j.stations || []){
    const placeName = tidy(s.place);
    if (placeName === "Blaustein") continue; // Blaustein gänzlich ignorieren
    if (stations.some(x => x.id === s.id)) continue;
    stations.push({id: s.id, name: s.brand || s.name, sub: s.name, street: [s.street, s.houseNumber].filter(Boolean).join(" "), place: placeName});
    added++;
    prices[s.id] = {status: s.isOpen ? "open" : "closed", e5: s.e5 ?? false};
  }
  return added;
}

async function refresh(){
  if (busy) return;
  if (!key){ msg("Bitte zuerst den API-Key in den Einstellungen eintragen.", true); return; }
  if (!stations.length){ return; }
  busy = true; msg("Lade Preise …");
  try {
    for (let i = 0; i < stations.length; i += 10){
      const ids = stations.slice(i, i + 10).map(s => s.id).join(",");
      const j = await call("prices.php", {ids});
      Object.assign(prices, j.prices || {});
    }
    updated = Date.now(); persist(); msg("");
  } catch(e){ msg(e.message, true); }
  busy = false; render();
}

async function geocodeAndAdd(q, rad){
  const r = await fetch("https://nominatim.openstreetmap.org/search?" + new URLSearchParams({q, format: "json", limit: 1, countrycodes: "de"}));
  const g = await r.json();
  if (!g.length) throw new Error("Ort „" + q + "“ nicht gefunden.");
  return addArea(+g[0].lat, +g[0].lon, Math.min(25, Math.max(1, rad)));
}

async function firstSetup(){
  msg("Suche Tankstellen in Memmingen, Ulm und Senden …");
  try {
    let n = 0;
    for (const p of PRESETS) n += await addArea(p.lat, p.lng, p.rad);
    updated = Date.now(); persist();
    msg(n + " Tankstellen hinzugefügt.");
  } catch(e){ msg(e.message, true); }
  render();
  refresh();
}

function fmt(p){
  const s = p.toFixed(3);
  return s.slice(0, 4).replace(".", ",") + "<sup>" + s[4] + "</sup> €";
}

function render(){
  $("upd").textContent = updated ? "Stand: " + new Date(updated).toLocaleString("de-DE", {weekday: "short", hour: "2-digit", minute: "2-digit"}) + " Uhr · " + stations.length + " Stationen" : "Noch nicht aktualisiert";
  const places = ["Alle", ...[...new Set(stations.map(s => s.place))].sort()];
  if (!places.includes(city)) city = "Alle";
  $("chips").innerHTML = places.map(p => `<button class="${p === city ? "on" : ""}" data-c="${p}">${p}</button>`).join("");
  $("btnOpen").textContent = "Nur geöffnete: " + (onlyOpen ? "an" : "aus");
  let rows = stations.filter(s => city === "Alle" || s.place === city).map(s => {
    const p = prices[s.id], e5 = p && p.status === "open" && typeof p.e5 === "number" ? p.e5 : null;
    return {s, p, e5};
  });
  if (onlyOpen) rows = rows.filter(r => r.e5 !== null || editing);
  rows.sort((a, b) => (a.e5 ?? 99) - (b.e5 ?? 99));
  const best = rows.length && rows[0].e5 !== null ? rows[0].e5 : null;
  if (!rows.length){
    $("list").innerHTML = `<li class="empty" style="display:block">${stations.length ? "Keine Preise vorhanden. Tippe auf „Jetzt aktualisieren“." : "Noch keine Tankstellen. Trage den API-Key ein."}</li>`;
    return;
  }
  $("list").innerHTML = rows.map(({s, p, e5}) => {
    const cls = (e5 !== null && e5 === best ? "best" : "") + (e5 === null ? " closed" : "");
    const right = e5 !== null ? `<span class="price">${fmt(e5)}</span>` : `<span class="na">${p ? (p.status === "closed" ? "geschlossen" : "kein Preis") : "–"}</span>`;
    return `<li class="${cls}"><div class="info"><div class="name">${esc(s.name)}</div><div class="addr">${esc(s.street)}, ${esc(s.place)}</div></div>${right}${editing ? `<button class="del" data-d="${s.id}" aria-label="Entfernen">✕</button>` : ""}</li>`;
  }).join("");
}
function esc(t){ return String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

$("btnSet").onclick = () => { const o = $("panel").classList.toggle("open"); $("btnSet").setAttribute("aria-expanded", o); $("key").value = key; };
$("saveKey").onclick = async () => {
  key = $("key").value.trim(); store.set("tk_key", key);
  if (!key){ msg("Bitte einen Key eintragen.", true); return; }
  $("panel").classList.remove("open");
  stations.length ? refresh() : firstSetup();
};
$("addCity").onclick = async () => {
  const q = $("city").value.trim(); if (!q) return;
  if (!key){ msg("Bitte zuerst den API-Key speichern.", true); return; }
  msg("Suche Tankstellen in " + q + " …");
  try { const n = await geocodeAndAdd(q, +$("rad").value || 6); persist(); msg(n + " neue Tankstellen hinzugefügt."); $("city").value = ""; $("panel").classList.remove("open"); render(); refresh(); }
  catch(e){ msg(e.message, true); }
};
$("btnRef").onclick = refresh;
$("btnOpen").onclick = () => { onlyOpen = !onlyOpen; render(); };
$("btnEdit").onclick = () => { editing = !editing; $("btnEdit").textContent = editing ? "Fertig" : "Stationen entfernen"; render(); };
$("btnReset").onclick = () => { if (confirm("Alle gespeicherten Stationen und den Key löschen?")){ stations = []; prices = {}; key = ""; updated = null; ["tk_key","tk_stations","tk_prices","tk_updated"].forEach(k => { try{ localStorage.removeItem(k); }catch(e){} }); render(); } };
$("chips").onclick = e => { const c = e.target.dataset.c; if (c){ city = c; render(); } };
$("list").onclick = e => { const d = e.target.dataset.d; if (d){ stations = stations.filter(s => s.id !== d); delete prices[d]; persist(); render(); } };

// Pull to refresh
(() => {
  const ptr = $("ptr"), ico = ptr.querySelector("svg"), page = document.querySelector("main");
  const TH = 70, MAX = 90, HOLD = 60;
  let sx = 0, sy = 0, dist = 0, pulling = false, locked = false;
  function show(m, rot){
    ptr.style.transition = page.style.transition = "none";
    page.style.transform = "translateY(" + m + "px)";
    ptr.style.transform = "translateY(" + (m / 2 - 19) + "px)";
    ptr.style.opacity = Math.min(1, m / 40);
    if (rot !== undefined) ico.style.transform = "rotate(" + rot + "deg)";
  }
  function settle(m, fade){
    ptr.style.transition = page.style.transition = "transform .25s ease, opacity .25s ease";
    page.style.transform = m ? "translateY(" + m + "px)" : "";
    ptr.style.transform = "translateY(" + (m / 2 - 19) + "px)";
    ptr.style.opacity = fade ? 0 : 1;
  }
  addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || window.scrollY > 0 || busy) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dist = 0; pulling = true; locked = false;
  }, {passive: true});
  addEventListener("touchmove", e => {
    if (!pulling) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (!locked){
      if (Math.abs(dx) > Math.abs(dy) || dy < -4){ pulling = false; return; }
      if (dy > 6) locked = true; else return;
    }
    if (window.scrollY > 0 || dy <= 0){ dist = 0; show(0); return; }
    e.preventDefault();
    dist = dy * 0.5;
    show(Math.min(dist, MAX), dist * 4);
  }, {passive: false});
  addEventListener("touchend", async () => {
    if (!pulling) return;
    pulling = false;
    if (dist >= TH){
      ico.style.transform = "";
      ptr.classList.add("spin");
      settle(HOLD, false);
      await Promise.all([refresh(), new Promise(r => setTimeout(r, 700))]);
      ptr.classList.remove("spin");
    }
    settle(0, true);
    dist = 0;
  });
  addEventListener("touchcancel", () => { pulling = false; settle(0, true); });
})();

render();
if (!key){ $("panel").classList.add("open"); msg("Trage zuerst deinen Tankerkönig API-Key ein."); }
else if (!stations.length) firstSetup();
else if (!updated || Date.now() - updated > 3600e3) refresh();
setInterval(() => { if (key && stations.length) refresh(); }, 3600e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden && key && updated && Date.now() - updated > 3600e3) refresh(); });
</script>
</body>
</html>
